<style>
:root{
  --bg:#07111F;--bg2:#10243A;--blue:#00C8FF;--orange:#FF8A30;--text:#F5F8FF;
  --muted:#8EA3BF;--line:rgba(255,255,255,.08);--glass:rgba(16,36,58,.55);
  --glass2:rgba(16,36,58,.85);--red:#FF4D6A;--green:#3CE6A0;--r:14px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;overflow:hidden}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(0,200,255,.10),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,rgba(255,138,48,.08),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .5em;font-weight:650;letter-spacing:.01em}
h2{font-size:20px}h3{font-size:15px;color:var(--blue)}
a{color:var(--blue)}
.app{display:grid;grid-template-columns:220px 1fr;height:100%;padding-top:var(--sat)}
.side{background:rgba(7,17,31,.75);backdrop-filter:blur(16px);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:14px 10px calc(10px + var(--sab)) calc(10px + var(--sal));overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px}
.brand b{font-size:13px;letter-spacing:.12em}.brand small{display:block;color:var(--orange);font-size:10px;letter-spacing:.2em}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),#0068ff);
  display:grid;place-items:center;font-weight:800;color:#001;box-shadow:0 6px 20px rgba(0,200,255,.35)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:10px;align-items:center;background:none;border:0;padding:9px 10px;border-radius:10px;
  color:var(--muted);cursor:pointer;text-align:left;transition:.2s}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav button.on{background:linear-gradient(90deg,rgba(0,200,255,.16),rgba(0,200,255,.02));color:var(--text);
  box-shadow:inset 2px 0 0 var(--blue)}
.main{position:relative;overflow:hidden;min-width:0}
.view{position:absolute;inset:0;overflow:auto;padding:20px 22px calc(24px + var(--sab));display:none}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.05)}
.card{padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);padding:8px 13px;border-radius:10px;cursor:pointer;
  transition:.15s;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(135deg,var(--blue),#0091ff);color:#001626;border:0;font-weight:650;box-shadow:0 4px 16px rgba(0,200,255,.3)}
.btn.org{background:linear-gradient(135deg,var(--orange),#ff5d1f);color:#1d0800;border:0;font-weight:650}
.btn.red{background:var(--red);border:0;color:#fff;font-weight:650}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.in,select,textarea{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:9px;padding:7px 9px;outline:none;min-width:0}
.in:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{width:100%;resize:vertical;min-height:60px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f .in,label.f select{color:var(--text)}
.muted{color:var(--muted)}.small{font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.tag.ok{color:var(--green);border-color:rgba(60,230,160,.3)}
.tag.warn{color:var(--orange);border-color:rgba(255,138,48,.35)}
.tag.bad{color:var(--red);border-color:rgba(255,77,106,.35)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
.hero{padding:26px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,200,255,.25),transparent 70%)}
.kpi{font-size:26px;font-weight:700}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
/* ===== Studio ===== */
#v-estudio{padding:0;overflow:hidden}
.studio{position:absolute;inset:0;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto}
.topbar{grid-column:1/4;display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);
  background:rgba(7,17,31,.6);backdrop-filter:blur(12px);overflow-x:auto}
.tools{grid-row:2;grid-column:1;width:56px;overflow-y:auto;border-right:1px solid var(--line);background:rgba(7,17,31,.5);padding:6px 4px;
  display:flex;flex-direction:column;gap:3px}
.tool{width:46px;height:42px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;display:grid;place-items:center;
  color:var(--muted);position:relative;flex:none}
.tool svg{width:20px;height:20px}
.tool:hover{background:rgba(255,255,255,.06);color:var(--text)}
.tool.on{background:rgba(0,200,255,.14);border-color:rgba(0,200,255,.4);color:var(--blue)}
.tool .tt{display:none}
.tsep{height:1px;background:var(--line);margin:4px 6px;flex:none}
.tgroups{display:none}
.tg{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:5px 11px;font-size:12px;flex:none;cursor:pointer}
.tg.on{color:var(--blue);border-color:var(--blue)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.ro .tools,body.ro .ctx,body.ro .topbar>*:not(.ro-keep),body.ro .bottom>#bKf,body.ro .bottom>#bKfDel,body.ro .bottom label,body.ro .side,body.ro .mobnav{display:none!important}
body.ro .app{grid-template-columns:1fr}body.ro .panel{display:none}
.rolabel{display:none}body.ro .rolabel{display:flex}
body.rec .glass,body.rec .side,body.rec .topbar{backdrop-filter:none;-webkit-backdrop-filter:none}
.bottom.vmode>:not(#vidCtl){display:none!important}.bottom:not(.vmode)>#vidCtl{display:none}
#vBar{min-width:140px}
.meter{width:60px;height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--green);transition:width .08s}
.stage-wrap{grid-row:2;grid-column:2;position:relative;overflow:hidden;background:#040a13;touch-action:none}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{grid-row:2;grid-column:3;width:300px;border-left:1px solid var(--line);background:rgba(7,17,31,.6);overflow-y:auto;padding:12px;transition:width .2s}
.panel.closed{width:0;padding:0;border:0;overflow:hidden}
.ptabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.ptabs button{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:6px 4px;cursor:pointer;font-size:12px;color:var(--muted)}
.ptabs button.on{color:var(--text);border-color:var(--blue);background:rgba(0,200,255,.1)}
.bottom{grid-column:1/4;border-top:1px solid var(--line);background:rgba(7,17,31,.7);padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctx{position:absolute;left:10px;top:10px;display:flex;gap:6px;align-items:center;padding:6px 8px;flex-wrap:wrap;max-width:calc(100% - 20px);z-index:3}
.ctx input[type=range]{width:80px}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.2);cursor:pointer;flex:none}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--blue)}
.zoomc{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;z-index:3}
.zoomc .btn{width:38px;justify-content:center;padding:7px 0}
.recbadge{position:absolute;right:10px;top:10px;z-index:4;display:none;align-items:center;gap:8px;padding:6px 12px;font-weight:700}
.recbadge.on{display:flex}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.camwin{position:absolute;z-index:5;border:2px solid var(--blue);border-radius:12px;overflow:hidden;display:none;touch-action:none;
  box-shadow:0 10px 30px rgba(0,0,0,.5);background:#000;cursor:move}
.camwin.on{display:block}
.camwin video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;transform:scaleX(-1)}
.camwin .rs{position:absolute;right:0;bottom:0;width:22px;height:22px;background:linear-gradient(135deg,transparent 50%,var(--blue) 50%);cursor:nwse-resize}
.pcard{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:rgba(0,0,0,.18)}
.pcard.sel{border-color:var(--blue)}
.pchip{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#001;flex:none}
.kfbar{flex:1;min-width:180px;position:relative;height:30px;background:rgba(0,0,0,.3);border-radius:8px;border:1px solid var(--line);cursor:pointer}
.kfbar .ph{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--orange);pointer-events:none}
.kfbar .kf{position:absolute;top:50%;width:9px;height:9px;transform:translate(-50%,-50%) rotate(45deg);pointer-events:none}
/* ===== Video editor ===== */
.ved{display:grid;grid-template-rows:auto auto 1fr;gap:12px;min-height:100%}
.vprev{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;max-height:52vh;margin:auto;width:100%}
.vprev canvas{width:100%;height:100%;display:block}
.tl{overflow-x:auto;padding:8px;position:relative}
.tlin{position:relative;min-width:100%}
.track{position:relative;height:46px;margin:4px 0 4px 64px;background:rgba(0,0,0,.25);border-radius:8px}
.track .lbl{position:absolute;left:-64px;width:60px;top:0;bottom:0;display:flex;align-items:center;font-size:11px;color:var(--muted)}
.clip{position:absolute;top:4px;bottom:4px;border-radius:7px;padding:3px 6px;font-size:11px;overflow:hidden;cursor:pointer;white-space:nowrap;
  border:1px solid rgba(255,255,255,.15)}
.clip.v{background:linear-gradient(180deg,rgba(0,200,255,.45),rgba(0,120,200,.35))}
.clip.a{background:linear-gradient(180deg,rgba(60,230,160,.4),rgba(20,140,90,.3))}
.clip.t{background:linear-gradient(180deg,rgba(255,138,48,.5),rgba(200,80,20,.35))}
.clip.sel{outline:2px solid #fff}
.tlph{position:absolute;top:0;bottom:0;width:2px;background:var(--orange);pointer-events:none;z-index:2}
.ruler{height:18px;margin-left:64px;position:relative;font-size:10px;color:var(--muted);cursor:pointer}
.ruler span{position:absolute;top:0;border-left:1px solid var(--line);padding-left:3px}
/* ===== Modal / toast ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:50;padding:16px}
.modal.on{display:grid}
.modal .box{width:min(560px,100%);max-height:88vh;overflow:auto;padding:18px;background:var(--glass2)}
.toast{position:fixed;left:50%;bottom:calc(80px + var(--sab));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast div{background:var(--glass2);border:1px solid var(--line);padding:9px 14px;border-radius:10px;backdrop-filter:blur(10px);animation:fade .2s;pointer-events:auto}
.toast .e{border-color:var(--red)}
.mapthumb{aspect-ratio:1;border-radius:10px;background:#040a13 center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;margin-bottom:10px}
.mobnav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{display:none}
  .mobnav{display:flex;overflow-x:auto;gap:2px;background:rgba(7,17,31,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + var(--sab))}
  .mobnav button{flex:none;min-width:64px;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:4px;border-radius:8px}
  .mobnav button svg{width:20px;height:20px}
  .mobnav button.on{color:var(--blue);background:rgba(0,200,255,.08)}
  .view{padding:14px 12px 20px}
  .studio{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}
  .topbar #mapSel{min-width:120px}.topbar #projName{min-width:130px}
  .tools{grid-row:2;grid-column:1;width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line)}
  .tsep{width:1px;height:auto;margin:6px 3px}
  .tools{flex-wrap:wrap;align-content:flex-start}
  .tgroups{display:flex;gap:6px;width:100%;overflow-x:auto;padding:2px 2px 6px}
  .tool.gh,.tsep{display:none}
  .glass,.side,.topbar,.panel{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .stage-wrap{grid-row:3;grid-column:1;min-height:0}
  .panel{grid-row:1/-1;grid-column:1;justify-self:end;position:relative;height:100%;z-index:8;width:min(340px,92vw);box-shadow:-10px 0 30px rgba(0,0,0,.5);background:rgba(7,17,31,.96)}
  .panel.closed{width:0}
  .bottom{grid-row:4}
  .topbar{grid-column:1;grid-row:1}
  .bottom{grid-column:1;grid-row:4}
}
@media print{
  body{background:#fff;color:#000;overflow:visible}
  .side,.mobnav,.noprint,.toast{display:none!important}
  .app{display:block}.main,.view{position:static;overflow:visible}
  .view{display:none!important}#v-relatorios{display:block!important}
  .glass{background:#fff;border:1px solid #ccc;box-shadow:none;backdrop-filter:none}
  th,td{border-color:#ccc;color:#000}h3{color:#004a80}
  .muted{color:#444}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">AT</div><div><b>ANALISTA TÁTICO</b><small>PRO · FREE FIRE</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sp"></div>
    <div class="small muted" style="padding:8px" id="sideInfo"></div>
  </aside>
  <main class="main">
    <section class="view" id="v-inicio"></section>
    <section class="view" id="v-mapas"></section>
    <section class="view" id="v-estudio">
      <div class="studio">
        <div class="topbar">
          <select id="mapSel" title="Mapa" aria-label="Mapa"></select>
          <input class="in" id="projName" placeholder="Nome do projeto" aria-label="Nome do projeto" style="width:170px">
          <span class="rolabel ro-keep small" style="gap:6px;align-items:center"><b id="roTitle"></b><span class="tag">Somente leitura</span></span>
          <button class="btn sm" id="bPhoto" title="Analisar foto ou vídeo de partida">📷 Foto/Vídeo</button>
          <button class="btn sm pri" id="bSave">Salvar</button>
          <button class="btn sm" id="bNew">Novo</button>
          <span class="sp"></span>
          <span class="small muted" id="saveState" aria-live="polite"></span>
          <button class="btn sm" id="bUndo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer">↶</button>
          <button class="btn sm" id="bRedo" title="Refazer (Ctrl+Y)" aria-label="Refazer">↷</button>
          <button class="btn sm" id="bPng">Imagem</button>
          <button class="btn sm" id="bSharePng">Compartilhar</button>
          <button class="btn sm org" id="bRecOpen">● Gravar</button>
          <button class="btn sm" id="bPanel">Painel</button>
        </div>
        <div class="tools" id="tools"></div>
        <div class="stage-wrap" id="stageWrap">
          <canvas id="stage"></canvas>
          <div class="ctx glass" id="ctxBar"></div>
          <div class="recbadge glass" id="recBadge" role="status"><span class="dot"></span><span id="recTime">00:00</span><span class="meter" title="Nível do microfone"><i id="recMeter"></i></span>

const DB = {
  db: null, name: 'analista-tatico-pro', ver: 2,

      r.onerror = () => rej(r.error);
      r.onblocked = () => toast('Feche outras abas do app para concluir a atualização do banco local.', true);

    });

  all(s) { return this.tx(s, 'readonly', st => st.getAll()); },

/* ---------- JSON seguro e sanitização (backups, projetos, nuvem) ---------- */
const BAD_KEYS = new Set(['__proto__', 'constructor', 'prototype']);
function safeParse(text) { return JSON.parse(text, (k, v) => BAD_KEYS.has(k) ? undefined : v); }
function sanitize(v, depth = 0) {
  if (depth > 24) throw new Error('estrutura aninhada demais');
  if (v === null) return null;
  if (typeof v === 'string') return v.length > 200000 && !v.startsWith('data:') ? v.slice(0, 200000) : v;
  if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
  if (typeof v === 'boolean') return v;
  if (Array.isArray(v)) { if (v.length > 500000) throw new Error('lista grande demais'); return v.map(x => sanitize(x, depth + 1)); }
  if (typeof v === 'object') { const o = {}; for (const [k, x] of Object.entries(v)) { if (BAD_KEYS.has(k) || x === undefined || typeof x === 'function') continue; o[String(k).slice(0, 200)] = sanitize(x, depth + 1); } return o; }
  return undefined;
}
const SCHEMA = { // validação estrutural mínima por coleção
  projects: { id: 'string', name: 'string', mapId: 'string', objects: 'array', players: 'array', keyframes: 'object' },
  maps: { id: 'string', name: 'string', versions: 'array', regions: 'array' },
  chars: { id: 'string', name: 'string' }, weapons: { id: 'string', name: 'string' },
  matches: { id: 'string', date: 'number' }, vods: { id: 'string', name: 'string', annotations: 'array' },
  media: { id: 'string', kind: 'string' }, kv: { id: 'string' }
};
function validateRecord(store, r) {
  const sc = SCHEMA[store]; if (!sc) return 'coleção desconhecida';
  if (!r || typeof r !== 'object' || Array.isArray(r)) return 'registro não é um objeto';
  for (const [k, t] of Object.entries(sc)) {
    const v = r[k], ok = t === 'array' ? Array.isArray(v) : t === 'object' ? v && typeof v === 'object' && !Array.isArray(v) : typeof v === t;
    if (!ok) return `campo "${k}" ausente ou inválido`;
  }

  if (store === 'projects' && r.players.length !== 4) return 'projeto deve ter 4 jogadores';

}

const Settings = {

/* ==========================================================
   BIBLIOTECA DE MAPAS
   Nenhuma imagem oficial é embutida: os arquivos precisam ser
   importados pelo analista (fonte autorizada). Enquanto isso o
   mapa fica marcado como PENDENTE e o editor usa uma grade tática.

const BUILTIN_MAPS = [
  { id: 'bermuda', name: 'Bermuda' }, { id: 'purgatorio', name: 'Purgatório' }, { id: 'kalahari', name: 'Kalahari' },
  { id: 'novaterra', name: 'Nova Terra (Nexterra)' }, { id: 'solara', name: 'Solara' },
  { id: 'alpine', name: 'Alpine (histórico)' }, { id: 'bermuda-remaster', name: 'Bermuda Remasterizado' }
];
const Maps = {
  list: [], imgCache: {},
  async load() {
    const saved = await DB.all('maps');
    for (const b of BUILTIN_MAPS) if (!saved.find(m => m.id === b.id)) {
      const m = { id: b.id, name: b.name, builtin: true, versions: [], active: null, regions: [], created: 0 };
      await DB.put('maps', m); saved.push(m);
    }
    // migração v1→v2: regiões passam a usar coordenadas normalizadas (0–1), estáveis entre versões do mapa
    for (const m of saved) if (m.regions.some(r => r.nx == null)) {
      const v = this.activeVersion(m), w = v?.w || 2000, h = v?.h || 2000;
      m.regions = m.regions.map(r => r.nx == null ? { id: r.id || uid(), name: r.name, nx: r.x / w, ny: r.y / h } : r);
      await DB.put('maps', m, { silent: true });
    }
    this.list = saved.sort((a, b) => (b.builtin - a.builtin) || a.name.localeCompare(b.name));
  },
  get(id) { return this.list.find(m => m.id === id); },
  activeVersion(m) { return m && m.versions.find(v => v.vid === m.active); },
  status(m) { return m.versions.length ? 'ok' : 'pendente'; },
  async image(m) { // retorna HTMLImageElement da versão ativa ou null
    const v = this.activeVersion(m); if (!v) return null;
    if (this.imgCache[v.mediaId]) return this.imgCache[v.mediaId];
    const rec = await DB.get('media', v.mediaId); if (!rec) return null;
    const img = new Image(); img.src = URL.createObjectURL(rec.blob);
    await img.decode().catch(() => { });

  },
  async importImage(m, file) {
    let f = file || await pickFile('image/*'); if (!f) return;
    if (!f.type.startsWith('image/')) return toast('Arquivo não é uma imagem.', true);
    if (f.size > 80e6) return toast('Imagem acima de 80 MB — reduza antes de importar.', true);
    const label = await Modal.prompt('Identificação desta versão do mapa (ex.: temporada / atualização do jogo):', Settings.data.gameVersion || '');
    if (label === null) return;
    let img = new Image(); img.src = URL.createObjectURL(f);
    try { await img.decode(); } catch { return toast('Não foi possível ler a imagem (formato não suportado?).', true); }
    const max = Settings.data.maxMapPx || 4096, big = Math.max(img.naturalWidth, img.naturalHeight);

      f = new File([b], f.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' }); img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
      toast(`Imagem reduzida de ${big}px para ${max}px (limite em Configurações).`);
    }
    const mediaId = 'mapimg-' + uid();
    await DB.put('media', { id: mediaId, kind: 'mapimg', name: f.name, blob: f, mime: f.type, size: f.size, date: Date.now() });
    const v = { vid: uid(), label: label || f.name, mediaId, w: img.naturalWidth, h: img.naturalHeight, file: f.name, date: Date.now() };
    m.versions.push(v); m.active = v.vid; m.updated = Date.now();
    this.imgCache[mediaId] = img;
    await DB.put('maps', m); toast(`Mapa ${m.name} importado (${v.w}×${v.h}px) e salvo para uso offline.`);
    Views.mapas.render();
  },
  async newCustom() {
    const name = await Modal.prompt('Nome do mapa personalizado:'); if (!name) return;
    const m = { id: 'custom-' + uid(), name, builtin: false, versions: [], active: null, regions: [], created: Date.now() };
    await DB.put('maps', m); this.list.push(m); await this.importImage(m); Views.mapas.render();
  },
  async removeVersion(m, vid) {

/* ==========================================================
   NUVEM — Firebase Auth + Firestore + Storage
   - Projetos privados por usuário (users/{uid}/items)
   - Sincronização com revisões (rev) e transações: conflitos nunca apagam dados
   - Fila de alterações pendentes (offline) com reenvio automático
   - Migração dos dados locais sem apagar nada
   - Links públicos (shares/{id}) com revogação, expiração e acesso por e-mail

const FB_VER = '10.12.2';

  'auth/invalid-credential': 'E-mail ou senha incorretos.', 'auth/email-already-in-use': 'Este e-mail já tem conta.', 'auth/weak-password': 'Senha fraca (mínimo 6 caracteres).',
  'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos.', 'auth/network-request-failed': 'Sem conexão com a internet.',
  'auth/popup-closed-by-user': 'Login cancelado.', 'auth/unauthorized-domain': 'Este domínio não está autorizado no Firebase (Authentication → Settings → Authorized domains).',

  },

  signOut() { return this.A.signOut(this.auth); },
  reset(e) { return this.A.sendPasswordResetEmail(this.auth, e); },
  norm(key, d) { if (!d) return null; return { key, ...d, serverTime: d.serverTime?.toMillis?.() ?? Date.now() }; },
  ref(uid, key) { return this.F.doc(this.db, 'users', uid, 'items', key); },

/* ---------- Motor de sincronização ---------- */
const Cloud = {

  syncable(store, id) { return SYNC_STORES.includes(store) || (store === 'kv' && SYNC_KV.includes(id)); },
  key(store, id) { return store + '~' + id; },
  async loadConfig() {

  },
  parseConfig(text) { // aceita o objeto copiado do console do Firebase, sem executar código

  statusText() { return this.status + (this.lastErr ? ' — ' + this.lastErr : ''); },

  async start() {

  mediaRefs(store, rec) { if (store === 'projects') return rec.bg?.type === 'photo' ? [rec.bg.mediaId] : []; return store === 'maps' ? (rec.versions || []).map(v => v.mediaId) : ['chars', 'weapons'].includes(store) && rec.imageId ? [rec.imageId] : []; },

const Projects = {
  exportOne(p) { download(new Blob([JSON.stringify({ app: 'analista-tatico-pro', type: 'project', version: APP_VERSION, format: BACKUP_FORMAT, project: p }, null, 1)], { type: 'application/json' }), (p.name || 'projeto').replace(/[^\w\-]+/g, '_') + '.atp.json'); },
  async importFile() {
    const f = await pickFile('.json,application/json'); if (!f) return;
    try {
      if (f.size > 30e6) throw new Error('arquivo acima de 30 MB');
      const j = safeParse(await f.text()); if (j?.app !== 'analista-tatico-pro') throw new Error('não é um arquivo deste app');
      if ((j.format || 1) > BACKUP_FORMAT) throw new Error('arquivo criado por uma versão mais nova do app — atualize');
      const list = (j.type === 'project' ? [j.project] : j.projects || []).map(p => sanitize(p));
      if (!list.length) throw new Error('arquivo sem projetos');
      const bad = list.map(p => validateRecord('projects', p)).filter(Boolean); if (bad.length) throw new Error(bad[0]);
      if (!await Modal.confirm(`Importar ${list.length} projeto(s): ${list.map(p => '"' + p.name + '"').join(', ').slice(0, 300)}? Projetos existentes não serão substituídos (se o identificador já existir, será criada uma cópia).`, 'Importar')) return;
      for (const p of list) { const ex = await DB.get('projects', p.id); if (ex) { p.id = uid(); p.name += ' (importado)'; } p.history = Array.isArray(p.history) ? p.history.slice(0, 25) : []; await DB.put('projects', p); }
      toast(list.length + ' projeto(s) importado(s).'); Views.estrategias.render();
    } catch (e) { toast('Arquivo inválido: ' + e.message, true); }
  }
};

};

    el.innerHTML = `<div class="glass hero" style="margin-bottom:14px"><div class="small" style="color:var(--orange);letter-spacing:.2em">ESTÚDIO DE ANÁLISE COMPETITIVA</div>
      <h1 style="font-size:28px;margin:6px 0">ANALISTA TÁTICO PRO</h1><p class="muted" style="max-width:560px">Mapa tático, squad animado, gravação com voz e câmera, edição, VOD, bibliotecas e relatórios — em um só lugar.</p>
      <div class="row"><button class="btn pri" id="hStudio">Abrir Estúdio Tático</button><button class="btn" id="hPhoto">📷 Analisar foto de partida</button><button class="btn" id="hVod">🎬 Análise de VOD</button><button class="btn" id="hRec">● Gravar análise</button></div></div>
      ${ready ? '' : `<div class="glass card" style="margin-bottom:14px;border-color:rgba(255,138,48,.4)"><b style="color:var(--orange)">Pendente:</b> nenhum mapa tem imagem importada ainda. <button class="btn sm" id="hMaps">Importar mapas</button></div>`}
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:14px">
        ${[['Projetos', ps.length], ['Mapas prontos', ready + '/' + Maps.list.length], ['Gravações', recs.length], ['Partidas (VOD)', vods.length], ['Partidas registradas', ms.length]].map(([l, v]) => `<div class="glass card"><div class="small muted">${l}</div><div class="kpi">${v}</div></div>`).join('')}</div>
      <div class="glass card"><h3>Projetos recentes</h3>${ps.slice(0, 6).map(p => `<div class="row pcard"><div><b>${esc(p.name)}</b><div class="small muted">${esc(Maps.get(p.mapId)?.name || '')} · ${fmtDate(p.updated)}</div></div><span class="sp"></span><button class="btn sm" data-op="${p.id}">Abrir</button></div>`).join('') || '<div class="empty small">Nenhum projeto salvo.</div>'}</div>`;
    $('#hStudio').onclick = () => go('estudio'); $('#hRec').onclick = () => { go('estudio'); $('#bRecOpen').click(); }; $('#hVod').onclick = () => go('vod'); $('#hPhoto').onclick = () => Studio.importPhoto();
    const hm = $('#hMaps'); if (hm) hm.onclick = () => go('mapas');
    $$('[data-op]', el).forEach(b => b.onclick = async () => { await Studio.loadProject(ps.find(p => p.id === b.dataset.op)); go('estudio'); });
  }
};
/* ==========================================================
   INICIALIZAÇÃO
   ========================================================== */
(async function boot() {
  const shareId = new URLSearchParams(location.search).get('share');
  buildNav();
  try { await DB.open(); } catch (e) { document.body.insertAdjacentHTML('afterbegin', `<div style="position:fixed;inset:0;z-index:99;background:#07111F;padding:30px">Não foi possível abrir o banco local: ${esc(e.message)}. Verifique se o navegador não está em modo privado.</div>`); return; }
  await Settings.load(); await Maps.load(); await seedLibraries(); await VEditor.load();
  Studio.init(); Recorder.bindCamWin();
  if (shareId) return Cloud.openShare(shareId); // visitante de link público: modo somente leitura
  const last = await DB.kv('lastProject'), lp = last && await DB.get('projects', last);
  if (lp) await Studio.loadProject(lp); else await Studio.setMap('bermuda');
  $('#sideInfo').textContent = 'v' + APP_VERSION + (Settings.data.team ? ' · ' + Settings.data.team : '');
  go(location.hash.slice(1) || 'inicio');
  setInterval(() => {
    if (!Studio.dirtyProject || Recorder.active || Studio.readOnly) return;
    if (Settings.data.autoSave) Studio.saveProject(true, true).catch(e => toast('Salvamento automático falhou: ' + e.message, true));
    else DB.put('kv', { id: 'autosave', v: deep(Studio.p), date: Date.now() }, { silent: true }).catch(() => { }); // rascunho de recuperação
  }, 30000);
  const as = await DB.get('kv', 'autosave');
  if (as && as.v && (!lp || as.v.id !== lp.id || as.date > lp.updated + 1000) && as.v.objects?.length) {
    if (await Modal.confirm(`Foi encontrado um rascunho não salvo ("${as.v.name}", ${fmtDate(as.date)}). Recuperar?`, 'Recuperar')) { await Studio.loadProject(as.v); Studio.dirtyProject = true; go('estudio'); }
    else await DB.del('kv', 'autosave', { silent: true });
  }
  await Recorder.recoverOrphans();
  Cloud.boot();
  // service worker (offline completo) só na versão com manifest.json + service-worker.js publicados junto
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && document.querySelector('link[rel="manifest"]'))
    navigator.serviceWorker.register('service-worker.js').catch(e => console.warn('SW:', e));
})();
</script>
